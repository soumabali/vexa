# Default configuration preset for Vexa project
# Version: 0.1.0-alpha
# Generated by vexa-plan on $(date +%Y-%m-%d)

settings:
  lint:
    command: npm run lint
    timeout_minutes: 10
  test:
    command: npm run test
    timeout_minutes: 15
  e2e:
    command: npm run test:e2e
    timeout_minutes: 20
  docker_build:
    target: production
    dockerfile: Dockerfile
    pull_base_image: true
    cache_from: []
    cache_to: []
    memory_limit_gb: 2.0
    timeout_minutes: 30

presets:
  eslint-config:
    extends:
      - eslint: recommended
      - prettier: default
    rules:
      printWidth: 100
      tabWidth: 2
      useTabs: false
  tailwind-theme:
    darkMode: 'media'
    theme:
      extend:
        colors:
          primary: '#3b82f6'
          secondary: '#10b981'
  typescript:
    tsconfigConfig:
      compilerOptions:
        target: es2022
        module: esnext
        strict: true
        noEmit: false
        incremental: true